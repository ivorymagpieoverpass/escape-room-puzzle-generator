[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "escape-room-puzzle-generator"
version = "0.4.2"
description = "AI-driven escape room and puzzle generator for Windows desktop."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "escape-room-puzzle-generator contributors" }]
keywords = ["escape-room", "puzzle", "generator", "llm", "game-design"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Games/Entertainment :: Puzzle Games",
]

dependencies = [
  "pydantic>=2.6,<3",
  "networkx>=3.2",
  "numpy>=1.26",
  "rich>=13.7",
  "typer>=0.12",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
llm = [
  "llama-cpp-python>=0.2.70",
  "sentence-transformers>=2.7",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "black>=24.4",
  "mypy>=1.10",
]

[project.scripts]
erpg = "escape_room.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/escape_room/core", "src/escape_room/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=escape_room --cov-report=term-missing"